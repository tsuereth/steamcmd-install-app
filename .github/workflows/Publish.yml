name: Publish

on:
  workflow_dispatch:
  # Run on a schedule to keep up with SteamCMD updates.
  schedule:
    - cron: '0 12 * * 5'

jobs:
  Publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Image
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          IMAGE_PUBLISH: true
        run: ./image-build.sh
